<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังเอกสาร PDF ออนไลน์ (อัปเดตอัตโนมัติ)</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 60px;
        }

        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            padding: 40px 20px 60px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .main-container {
            max-width: 1000px;
            margin: -30px auto 0;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .search-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--shadow);
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 24px;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .stats-bar {
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .document-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .doc-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .doc-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .doc-header {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .pdf-icon {
            width: 44px;
            height: 44px;
            background-color: #fef2f2;
            color: #ef4444;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .doc-info {
            flex: 1;
            overflow: hidden;
        }

        .doc-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            word-break: break-all;
        }

        .badge {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .doc-actions {
            display: flex;
            gap: 8px;
            border-top: 1px solid #f1f5f9;
            padding-top: 14px;
        }

        .btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-view {
            background-color: var(--primary-light);
            color: var(--primary);
        }

        .btn-view:hover {
            background-color: #dbeafe;
        }

        .btn-download {
            background-color: #f1f5f9;
            color: #475569;
        }

        .btn-download:hover {
            background-color: #e2e8f0;
        }

        .loading-state, .empty-state {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: var(--radius);
            grid-column: 1 / -1;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fa-solid fa-folder-open"></i> คลังเอกสาร PDF</h1>
        <p>ระบบดึงรายการไฟล์จาก GitHub อัตโนมัติ</p>
    </div>

    <div class="main-container">
        <div class="search-card">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="พิมพ์ชื่อเอกสารเพื่อค้นหา...">
            </div>
        </div>

        <div class="stats-bar">
            <span>พบเอกสารทั้งหมด <strong id="docCount" style="color: var(--primary);">0</strong> รายการ</span>
        </div>

        <div class="document-grid" id="documentGrid">
            <div class="loading-state">กำลังโหลดรายชื่อเอกสาร...</div>
        </div>
    </div>

    <script>
        // ⚙️ ตั้งค่าชื่อผู้ใช้และชื่อ Repository ของคุณตรงนี้
        const username = 'prachyak13';
        const repo = 'PDF';
        const folder = 'doc_pdf';

        let allFiles = [];
        const documentGrid = document.getElementById('documentGrid');
        const searchInput = document.getElementById('searchInput');
        const docCount = document.getElementById('docCount');

        async function fetchPDFs() {
            try {
                // ดึงข้อมูลผ่าน GitHub API
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${folder}`);
                const data = await response.json();

                if (Array.isArray(data)) {
                    // กรองเอาเฉพาะไฟล์ที่มีนามสกุล .pdf
                    allFiles = data.filter(item => item.type === 'file' && item.name.toLowerCase().endsWith('.pdf'));
                    renderDocuments(allFiles);
                } else {
                    documentGrid.innerHTML = `<div class="empty-state">ไม่พบโฟลเดอร์หรือไฟล์ในระบบ</div>`;
                }
            } catch (error) {
                documentGrid.innerHTML = `<div class="empty-state">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>`;
            }
        }

        function renderDocuments(files) {
            documentGrid.innerHTML = '';
            docCount.textContent = files.length;

            if (files.length === 0) {
                documentGrid.innerHTML = `<div class="empty-state">ไม่พบไฟล์ PDF ในโฟลเดอร์ doc_pdf</div>`;
                return;
            }

            files.forEach(file => {
                // ตัดนามสกุล .pdf ออกเพื่อให้ชื่อแสดงสวยงาม (สามารถปรับเปลี่ยนได้)
                const displayName = file.name.replace(/\.[^/.]+\$/, "");
                
                const card = document.createElement('div');
                card.className = 'doc-card';
                card.innerHTML = `
                    <div class="doc-header">
                        <div class="pdf-icon">
                            <i class="fa-solid fa-file-pdf"></i>
                        </div>
                        <div class="doc-info">
                            <div class="doc-title" title="${file.name}">${displayName}</div>
                            <div style="margin-top: 6px;">
                                <span class="badge">PDF Document</span>
                            </div>
                        </div>
                    </div>
                    <div class="doc-actions">
                        <a href="${file.download_url}" target="_blank" class="btn btn-view">
                            <i class="fa-regular fa-eye"></i> เปิดดู
                        </a>
                        <a href="${file.download_url}" download class="btn btn-download">
                            <i class="fa-solid fa-download"></i> โหลด
                        </a>
                    </div>
                `;
                documentGrid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = allFiles.filter(file => file.name.toLowerCase().includes(query));
            renderDocuments(filtered);
        });

        // เริ่มต้นทำงานเมื่อเปิดหน้าเว็บ
        fetchPDFs();
    </script>
</body>
</html>
